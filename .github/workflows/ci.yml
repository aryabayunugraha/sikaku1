name: Next.js CI

on:
  push:
    branches: [main, nextjs-sqlite]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and expand source bundle
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
        env:
          AUTH_SECRET: ci-only-secret-do-not-use-in-production-123456789
          PRIVATE_TOTP_SECRET: JBSWY3DPEHPK3PXP
      - name: Build
        run: npm run build
        env:
          AUTH_SECRET: ci-only-secret-do-not-use-in-production-123456789
          PRIVATE_TOTP_SECRET: JBSWY3DPEHPK3PXP
